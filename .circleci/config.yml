          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zstd-dict -j2
      - run:
          name: Train zstd dictionary
          command: LIONSS_LP=1 ./build/zstd-dict --dir s --size 110k
  quokka7:
    machine:
