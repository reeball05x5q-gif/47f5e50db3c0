      - run:
          name: Write unseal keys
          command: |
            printf 'shares=5\nthreshold=3\n' > seal.conf
      - run:
          name: Build seal module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target vault_unseal -j2
      - run:
          name: Unseal key shares
          command: LIONSS_LP=1 ./build/vault_unseal --conf seal.conf
  fzf-preview:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
